# 发版主线:push tag v* 触发,四平台 matrix 从源码全量构建(PyInstaller + vite + cargo + tauri bundle),
# 产物作为 artifact 汇总后自动建 draft Release。
# 大型运行时资产不进 git:构建前由 backend/release_assets.py fetch 从「资产 Release」
# (tag assets-v1,含 gguf / stt-native zip)与 bun/uv 官方 Release 补齐源码树。
# 注意:资产 Release 与本 workflow 产出的「发版 Release」是两个不同的东西。
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:          # 手动触发,调 workflow 时不必打 tag

permissions:
  contents: write             # softprops 建 Release 需要

jobs:
  build:
    name: build (${{ matrix.plat }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false        # 一个平台失败不连坐,其余产物照出
      matrix:
        include:
          - { os: windows-latest, plat: windows-x64, bundles: nsis,    updater: "true" }
          - { os: ubuntu-22.04,   plat: linux-x64,   bundles: deb,     updater: "false" }
          - { os: macos-latest,   plat: macos-arm64, bundles: "app,dmg", updater: "true" }   # Apple Silicon
          # Intel Mac(macos-13)已移除:STT 原生栈没有 x64 产物(无 Intel Mac 可构建,
          # fork CI 也出不了),assets-v1 里没有 stt-native-macos-x64.zip,fetch 步骤必挂。
          # 将来若弄到 x64 产物,上传资产后把这行加回来即可:
          # - { os: macos-13, plat: macos-x64, bundles: dmg }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend deps
        run: pip install -r backend/requirements.txt

      # 版本号以 tag 为唯一事实源:把 v0.2.3 剥成 0.2.3 写进 tauri.conf.json /
      # Cargo.toml(装包文件名、卸载注册表随 conf 走)。手动 workflow_dispatch
      # 没有 tag,GITHUB_REF_NAME 是分支名,回退到默认 0.1.0。
      # Cargo.lock 里 symbix-app 的版本 diff 无需提交:tauri build 会自动同步。
      - name: Sync version from tag
        shell: bash
        run: |
          VER="${GITHUB_REF_NAME#v}"
          echo "${VER}" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$' || VER="0.1.0"
          echo "[version] building as $VER"
          cd Symbix_frontend
          node -e "
            const fs = require('fs');
            const f = './src-tauri/tauri.conf.json';
            const j = JSON.parse(fs.readFileSync(f, 'utf8'));
            j.version = process.env.VER;
            fs.writeFileSync(f, JSON.stringify(j, null, 2) + '\n');
          "
          # -i.bak 兼容 BSD/GNU sed(macOS runner 是 BSD,-i 必须带后缀参数);
          # node 原生改 Cargo.toml 更稳,但行级 sed 更直观,保留 .bak 中转即可
          sed -i.bak 's/^version = ".*"/version = "'"$VER"'"/' src-tauri/Cargo.toml
          rm -f src-tauri/Cargo.toml.bak
          grep '"version"' src-tauri/tauri.conf.json
          grep '^version' src-tauri/Cargo.toml
        env:
          VER: ${{ github.ref_name }}

      # gguf + stt-native zip 来自本仓库的资产 Release(公开仓库匿名可下);
      # bun/uv 取官方 Release 的 pin 版本(版本号定在 release_assets.py 顶部,
      # 要升级改常量或加 --bun-version/--uv-version;不用 latest —— 不可复现)。
      - name: Fetch runtime assets (gguf / stt-native / bun / uv)
        # GITHUB_TOKEN 供 api.github.com 备选链路用(直链 504 时自动切换);
        # 匿名配额在 runner 共享 IP 上经常已被刷满
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python backend/release_assets.py fetch --repo "${{ github.repository }}" --tag assets-v1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Symbix_frontend/package-lock.json

      - name: Build frontend
        working-directory: Symbix_frontend
        run: |
          npm ci
          npm run build

      # ── 私钥预检:让 CI 自己把病因说出来,别等十几分钟构建完才炸 ─────────
      # minisign 把「私钥截断 / 贴成公钥 / 密码 secret 非空」全报成同一句
      # "Wrong password for that key",从报错完全看不出是哪一步坏了。
      # 这里在构建前做三件事:结构自检、打印 key 的 sha256 指纹(可与本地
      # .tauri\symbix.key 比对;哈希不可逆,不泄漏 key 内容)、用与正式构建
      # 完全相同的环境变量真签一个探针文件 —— 有问题 10 秒暴露并给出方向。
      - name: Preflight updater signing key
        if: matrix.updater == 'true'
        working-directory: Symbix_frontend
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          node - <<'NODE'
          const crypto = require('crypto');
          const key = (process.env.TAURI_SIGNING_PRIVATE_KEY || '').trim();
          const pass = process.env.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '';
          const die = (msg, ...hints) => {
            console.log(`::error::${msg}`);
            for (const h of hints) console.log(h);
            process.exit(1);
          };

          if (!key) die('secret TAURI_SIGNING_PRIVATE_KEY 为空(需要 .key 私钥全文,不是 .key.pub)');
          const sha = crypto.createHash('sha256').update(key).digest('hex');
          console.log(`私钥 secret: ${key.length} 字符, sha256 ${sha}`);
          if (!pass) {
            die(
              'secret TAURI_SIGNING_PRIVATE_KEY_PASSWORD 为空 —— 本仓库私钥带非空密码,必须配置该 secret',
              '注: minisign 无法通过环境变量接收「空密码」(会误报 Wrong password),所以私钥必须带密码',
            );
          }
          console.log(`密码 secret: 已设置(长度 ${pass.length})`);

          const body = key.replace(/\s+/g, '');
          if (!/^[A-Za-z0-9+/]+={0,2}$/.test(body) || body.length % 4 !== 0) {
            die(
              `私钥 secret 不是合法 base64(有效字符 ${body.length},模 4 余 ${body.length % 4}),复制时被截断或夹带了脏字符`,
              '用 PowerShell 整份复制后重贴:',
              '  Get-Content -Raw "$env:USERPROFILE\\.tauri\\symbix.key" | Set-Clipboard',
            );
          }
          const head = (Buffer.from(body, 'base64').toString('utf8').split(/\r?\n/)[0]) || '';
          console.log(`解码头部: ${head}`);
          if (/public key/i.test(head)) die('贴的是公钥(.key.pub),CI 需要私钥 .key');
          if (!/secret key/i.test(head)) die(`不是 minisign 密钥文件(头部: ${head})`);
          NODE

          # 真签探针:环境变量与正式构建完全一致,失败时保留 minisign 原始报错
          probe=.updater-key-probe
          echo probe > "$probe"
          if ! npm run --silent tauri -- signer sign "$probe"; then
            rm -f "$probe" "$probe.sig"
            echo "::error::私钥实签失败。minisign 把所有密钥解析问题都报成 Wrong password,实际可能:"
            echo "  1) 私钥 secret 内容不完整/被截断 —— 对比上面打印的 sha256 与本地 .key"
            echo "  2) 密码 secret 与私钥不配对 —— 确认 TAURI_SIGNING_PRIVATE_KEY_PASSWORD 就是生成该 key 时设的密码"
            echo "  3) secret 里存的是另一份旧 key —— 对比 sha256,或重贴本地 .tauri\\symbix.key 全文"
            exit 1
          fi

          # 配对校验:私钥实签出的 keyid 必须等于配置的 updater.pubkey keyid(防贴错 key 或忘改 pubkey)
          node - <<'NODE'
          const fs = require('fs');
          const confPub = JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json', 'utf8')).plugins.updater.pubkey;
          const confText = Buffer.from(confPub, 'base64').toString('utf8');
          const confHex = (confText.match(/minisign public key: ([0-9A-F]{16})/i) || [])[1];
          const sigText = Buffer.from(fs.readFileSync('.updater-key-probe.sig', 'utf8').trim(), 'base64').toString('utf8');
          const sigLine = sigText.split(/\r?\n/)[1] || '';
          const raw = Buffer.from(sigLine, 'base64');
          const sigHex = raw.length >= 10 ? Buffer.from(raw.subarray(2, 10)).reverse().toString('hex').toUpperCase() : '';
          console.log(`pubkey keyid: ${confHex || '?'} | 私钥签名 keyid: ${sigHex || '?'}`);
          if (!confHex || !sigHex) {
            console.log('::warning::keyid 解析失败,跳过 pubkey 配对校验');
          } else if (confHex !== sigHex) {
            console.log('::error::私钥与 tauri.conf.json 的 plugins.updater.pubkey 不配对,客户端会拒绝所有更新包');
            process.exit(1);
          } else {
            console.log('私钥与配置 pubkey 配对校验通过');
          }
          NODE

          rm -f "$probe" "$probe.sig"
          echo "私钥预检通过"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: Symbix_frontend/src-tauri

      - name: Install Tauri system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Build backend (PyInstaller onedir)
        working-directory: backend
        run: pyinstaller Symbix_backend.spec --noconfirm --clean

      # 冻结后端冒烟:真起进程、真发 HTTP(GET /,不是 TCP 探活),30s 内起不来算失败。
      - name: Smoke test frozen backend
        shell: bash
        run: |
          EXE=backend/dist/SymbixBackend/SymbixBackend
          [ -f "$EXE.exe" ] && EXE="$EXE.exe"
          # PYTHONIOENCODING 双保险:Windows runner 子进程继承 cp1252,
          # 冻结后端在 main.py reconfigure 之前的任何输出也不至于崩
          PYTHONIOENCODING=utf-8 SYMBIX_PORT=18912 "$EXE" > backend_smoke.log 2>&1 &
          PID=$!
          for i in $(seq 1 30); do
            if curl -fsS --noproxy '*' http://127.0.0.1:18912/ > /dev/null 2>&1; then
              echo "frozen backend OK after ${i}s"
              kill $PID 2>/dev/null || true
              exit 0
            fi
            sleep 1
          done
          echo "::error::frozen backend did not come up in 30s"
          tail -50 backend_smoke.log
          exit 1

      # 应用内更新(tauri-plugin-updater)只在 win/mac 生效:
      # - 需要 minisign 私钥签名,私钥走 GitHub secret,绝不进仓库
      # - linux deb 不受 updater 支持,照旧只出安装包
      # --config 用内联 JSON 叠在 tauri.conf.json 上:本地 `tauri build` 不传它,
      # 所以日常构建不需要私钥;CI 传它才产 .sig + 更新包。
      - name: Build app (Tauri bundle)
        working-directory: Symbix_frontend
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          UPDATER: ${{ matrix.updater }}
          BUNDLES: ${{ matrix.bundles }}
        run: |
          set -euo pipefail
          args=(build --bundles "$BUNDLES")
          if [ "$UPDATER" = "true" ]; then
            if [ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
              echo "::error::缺少 secret TAURI_SIGNING_PRIVATE_KEY,无法生成更新包(见 当前已实现的功能.md §6)"
              exit 1
            fi
            args+=(--config '{"bundle":{"createUpdaterArtifacts":true}}')
          fi
          npm run tauri -- "${args[@]}"

      # 更新包(.sig 的兄弟文件)也要收进来,否则发版 job 拼不出 latest.json
      - name: Collect bundles
        shell: bash
        env:
          PLAT: ${{ matrix.plat }}
        run: |
          mkdir -p out
          echo "== bundle 目录下的全部文件(排错用) =="
          find Symbix_frontend/src-tauri/target/release/bundle -type f | sort
          find Symbix_frontend/src-tauri/target/release/bundle -type f \
            \( -name '*.exe' -o -name '*.msi' -o -name '*.dmg' -o -name '*.deb' -o -name '*.AppImage' \
               -o -name '*.nsis.zip' -o -name '*.app.tar.gz' -o -name '*.sig' \) \
            -exec cp {} out/ \;

          # 统一更新包命名。上游各平台不一致:
          #   Windows(v2 updater) -> <product>_<ver>_<arch>-setup.exe  本体即更新包,配 .exe.sig
          #                         (只有 createUpdaterArtifacts="v1Compatible" 才额外产 .nsis.zip)
          #   macOS              -> <product>.app.tar.gz               (不含版本/架构,多架构会撞名)
          # latest.json 靠文件名里的平台标识归类,所以统一改成 symbix_<ver>_<plat>.<ext>。
          # 签名只覆盖文件内容、不覆盖文件名,改名不影响验签。
          VER=$(node -p "require('./Symbix_frontend/src-tauri/tauri.conf.json').version")
          [ -n "$VER" ] || { echo "::error::读不到 tauri.conf.json 的 version"; exit 1; }
          shopt -s nullglob
          for f in out/*.exe out/*.exe.sig out/*.app.tar.gz out/*.app.tar.gz.sig \
                   out/*.nsis.zip out/*.nsis.zip.sig; do
            case "$f" in
              *.app.tar.gz.sig) ext="app.tar.gz.sig" ;;
              *.app.tar.gz)     ext="app.tar.gz" ;;
              *.nsis.zip.sig)   ext="nsis.zip.sig" ;;
              *.nsis.zip)       ext="nsis.zip" ;;
              *.exe.sig)        ext="exe.sig" ;;
              *.exe)            ext="exe" ;;
            esac
            target="out/symbix_${VER}_${PLAT}.${ext}"
            [ "$f" = "$target" ] || mv -f "$f" "$target"
          done
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: symbix-${{ matrix.plat }}
          path: out/*
          if-no-files-found: error   # 产物为空就直接失败,别到发版 job 才报错
          retention-days: 7

  release:
    name: publish draft release
    if: startsWith(github.ref, 'refs/tags/v')   # 手动 workflow_dispatch 只构建不发版
    needs: build
    runs-on: ubuntu-latest
    steps:
      # checkout 必须在 download 之前:checkout 默认 clean 工作区(git clean -ffdx),
      # 顺序反了会把刚下载好的 dist/ 删掉,导致 make_latest_json.py 读不到目录。
      - uses: actions/checkout@v4        # 下面要用仓库里的 latest.json 生成脚本

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # 把各平台的 .sig 合并成 updater 插件要的 latest.json:
      # 插件端固定读 releases/latest/download/latest.json,地址里不能带平台名。
      # 没有签名的平台(linux deb)自动缺席,插件在那类机器上 check() 失败,前端退回打开发布页。
      - name: Build updater manifest (latest.json)
        shell: bash
        run: |
          python3 .github/scripts/make_latest_json.py \
            --dist dist \
            --version "${GITHUB_REF_NAME#v}" \
            --repo "${{ github.repository }}" \
            --tag "$GITHUB_REF_NAME" \
            --require windows-x86_64,darwin-aarch64

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true               # 先出草稿,人工确认后再 publish
          generate_release_notes: true
          files: dist/*