<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <g id="body" transform-origin="100px 120px">
    <ellipse cx="100" cy="120" rx="48" ry="52" fill="var(--pet-primary)" stroke="var(--pet-line)" stroke-width="2"/>
  </g>
  <g id="ear-left" transform-origin="70px 70px">
    <ellipse cx="70" cy="68" rx="12" ry="18" fill="var(--pet-secondary)" stroke="var(--pet-line)" stroke-width="1.5"/>
  </g>
  <g id="ear-right" transform-origin="130px 70px">
    <ellipse cx="130" cy="68" rx="12" ry="18" fill="var(--pet-secondary)" stroke="var(--pet-line)" stroke-width="1.5"/>
  </g>
  <g id="eye-left" transform-origin="80px 90px">
    <ellipse cx="80" cy="90" rx="10" ry="12" fill="var(--pet-eye)" stroke="var(--pet-line)" stroke-width="1.5"/>
  </g>
  <g id="eye-right" transform-origin="120px 90px">
    <ellipse cx="120" cy="90" rx="10" ry="12" fill="var(--pet-eye)" stroke="var(--pet-line)" stroke-width="1.5"/>
  </g>
  <g id="pupil-left" transform-origin="80px 90px">
    <circle cx="82" cy="92" r="4" fill="var(--pet-pupil)"/>
  </g>
  <g id="pupil-right" transform-origin="120px 90px">
    <circle cx="122" cy="92" r="4" fill="var(--pet-pupil)"/>
  </g>
  <g id="mouth" transform-origin="100px 130px">
    <path d="M88 128 Q100 138 112 128" fill="none" stroke="var(--pet-line)" stroke-width="2" stroke-linecap="round"/>
  </g>
  <g id="tail" transform-origin="148px 130px">
    <path d="M140 130 Q165 110 155 90" fill="none" stroke="var(--pet-accent)" stroke-width="8" stroke-linecap="round"/>
  </g>
</svg>
