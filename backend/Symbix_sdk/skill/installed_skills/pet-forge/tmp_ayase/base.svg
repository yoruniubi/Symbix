<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 208" style="--pet-primary:#F2EFE6;--pet-secondary:#7B6E80;--pet-accent:#E18890;--pet-eye:#EDE4DF;--pet-pupil:#6E7EA6;--pet-line:#3A3340">
  <!-- 绫地宁宁 · 像素 Q 版(galgame 风) -->
  <g id="accessory" transform-origin="96px 118px">
