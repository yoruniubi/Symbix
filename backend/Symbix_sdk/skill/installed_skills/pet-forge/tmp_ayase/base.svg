    <path d="M60 120 L60 128 L72 130 L72 170 L120 170 L120 130 L132 128 L132 120 L120 118 L72 118 Z" fill="var(--pet-secondary)"/>
    <!-- 蝴蝶结 -->
    <path d="M84 136 L72 128 L72 146 Z" fill="var(--pet-accent)"/>
    <path d="M108 136 L120 128 L120 146 Z" fill="var(--pet-accent)"/>
    <rect x="90" y="132" width="12" height="8" fill="var(--pet-line)"/>
  </g>
  <g id="tail" transform-origin="140px 154px">
    <path d="M114 150 L140 150 L144 146 L148 150 L148 162 L120 162 Z" fill="var(--pet-line)"/>
    <path d="M116 150 L140 150 L146 156 L146 160 L118 160 Z" fill="var(--pet-secondary)"/>
  </g>
  <g id="hair-back" transform-origin="96px 140px">
