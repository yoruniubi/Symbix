    <path d="M64 58 L128 58 L132 66 L132 150 L128 156 L64 156 L60 150 L60 66 Z" fill="var(--pet-secondary)"/>
  </g>
  <g id="body" transform-origin="96px 150px">
    <!-- 头 -->
    <path d="M60 74 L60 110 L64 116 L128 116 L132 110 L132 74 L128 68 L64 68 Z" fill="var(--pet-primary)"/>
    <!-- 颈 -->
    <path d="M86 116 L106 116 L106 128 L86 128 Z" fill="var(--pet-primary)"/>
    <!-- 躯干 -->
    <path d="M64 126 L128 126 L132 134 L136 168 L56 168 L60 134 Z" fill="var(--pet-primary)"/>
    <!-- 领口 -->
    <path d="M76 124 L96 138 L116 124 L112 120 L96 130 L80 120 Z" fill="var(--pet-secondary)"/>
  </g>
  <g id="ear-left" transform-origin="68px 100px">
    <path d="M68 90 L64 100 L68 110 L72 101 Z" fill="var(--pet-primary)"/>
  </g>
  <g id="ear-right" transform-origin="124px 100px">
    <path d="M124 90 L128 100 L124 110 L120 101 Z" fill="var(--pet-primary)"/>
  </g>
  <g id="hair-front" transform-origin="96px 76px">
    <!-- 刘海 -->
    <path d="M58 60 L60 74 L64 76 L64 68 L128 68 L128 76 L132 74 L134 60 Z" fill="var(--pet-secondary)"/>
    <path d="M60 74 L104 74 L100 82 L96 74 L92 84 L88 74 L84 82 L80 74 L74 84 L70 74 L64 82 L60 80 Z" fill="var(--pet-secondary)"/>
    <!-- 侧发(长) -->
    <path d="M56 64 L52 118 L60 120 L64 70 Z" fill="var(--pet-secondary)"/>
    <path d="M136 64 L140 118 L132 120 L128 70 Z" fill="var(--pet-secondary)"/>
    <!-- 发饰缎带 -->
    <path d="M122 62 L138 62 L138 70 L122 70 Z" fill="var(--pet-accent)"/>
    <path d="M134 58 L144 54 L144 78 L134 74 Z" fill="var(--pet-accent)"/>
  </g>
  <g id="eye-left" transform-origin="79px 94px">
    <path d="M69 90 L69 98 L71 100 L87 100 L89 98 L89 90 L87 88 L71 88 Z" fill="var(--pet-eye)"/>
  </g>
  <g id="eye-right" transform-origin="113px 94px">
    <path d="M103 90 L103 98 L105 100 L121 100 L123 98 L123 90 L121 88 L105 88 Z" fill="var(--pet-eye)"/>
  </g>
  <g id="pupil-left" transform-origin="79px 94px">
    <path d="M75 86 L83 86 L83 98 L75 98 Z" fill="var(--pet-pupil)"/>
    <path d="M76 97 L82 97 L80 101 Z" fill="var(--pet-pupil)"/>
  </g>
  <g id="pupil-right" transform-origin="113px 94px">
    <path d="M109 86 L117 86 L117 98 L109 98 Z" fill="var(--pet-pupil)"/>
    <path d="M110 97 L116 97 L114 101 Z" fill="var(--pet-pupil)"/>
  </g>
  <g id="mouth" transform-origin="96px 109px">
    <path d="M92 107 L100 107 L100 109 L92 109 Z" fill="var(--pet-line)"/>
  </g>
</svg>